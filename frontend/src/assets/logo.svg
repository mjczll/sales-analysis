<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-labelledby="title desc">
  <title id="title">销售业绩分析系统</title>
  <desc id="desc">由递增柱状图与上升折线箭头组成的销售分析图标</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <!-- 圆角方块底 -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)"/>

  <!-- 柱状图：从左到右递增，体现业绩增长 -->
  <rect x="104" y="288" width="60" height="132" rx="16" fill="url(#barGrad)"/>
  <rect x="196" y="232" width="60" height="188" rx="16" fill="url(#barGrad)"/>
  <rect x="288" y="168" width="60" height="252" rx="16" fill="url(#barGrad)"/>

  <!-- 上升折线 + 箭头：体现趋势向上 -->
  <path d="M134 288 L226 232 L318 168" fill="none" stroke="url(#lineGrad)" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M331 159 L295 167 L311 190 Z" fill="#FFFFFF"/>
</svg>
